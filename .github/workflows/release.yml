name: Build and release

on:
  push:
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    name: Verify build output is in sync with source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build
        run: node build.mjs
      - name: Fail if generated files drifted from committed
        run: |
          if [[ -n "$(git status --porcelain tokens.css tokens.ts tailwind.preset.cjs tokens.dart)" ]]; then
            echo "::error::Generated files do not match source. Run 'npm run build' and commit the result."
            git diff tokens.css tokens.ts tailwind.preset.cjs tokens.dart
            exit 1
          fi
          echo "Build output is in sync with source."

  release:
    name: Tag → GitHub release
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build
        run: node build.mjs
      - name: Bundle artefacts
        run: |
          mkdir -p release
          cp tokens.css tokens.ts tailwind.preset.cjs tokens.dart release/
          cd release && tar czf ../eq-design-tokens-${{ github.ref_name }}.tar.gz .
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: eq-design-tokens-${{ github.ref_name }}.tar.gz
          generate_release_notes: true
